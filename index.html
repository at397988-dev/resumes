<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出勤・退勤 System</title>

    <style>
    /* Reset */
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    /* Body */
    body{
        font-family:Arial, sans-serif;
        background:#0f172a;
        color:white;
        padding:30px;
    }

    /* Container */
    .container{
        max-width:1200px;
        margin:auto;
    }

    /* Title */
    h1{
        text-align:center;
        margin-bottom:30px;
        font-size:40px;
    }

    /* Input Box */
    .info-box{
        display:flex;
        gap:15px;
        margin-bottom:25px;
        flex-wrap:wrap;
    }

    .info-box input{
        flex:1;
        min-width:200px;
        padding:14px;
        border:none;
        border-radius:10px;
        outline:none;
        font-size:16px;
    }

    /* Buttons */
    .btn-box{
        display:flex;
        justify-content: center;
        gap:20px;
        margin-bottom:30px;
    }

    button{
        padding:14px 35px;
        border:none;
        border-radius:10px;
        cursor:pointer;
        font-size:18px;
        font-weight:bold;
        transition:0.3s;
    }

    button:hover{
        transform:scale(1.05);
    }

    .start-btn{
        background:#22c55e;
        color:white;
    }

    .end-btn{
        background:#ef4444;
        color:white;
    }

    /* Table */
    table{
        width:100%;
        border-collapse:collapse;
        background:white;
        color:black;
        overflow:hidden;
        border-radius:10px;
    }

    th{
        background:#1e293b;
        color:white;
    }

    th, td{
        border:1px solid #d1d5db;
        padding:14px;
        text-align:center;
    }

    /* Summary */
    .summary{
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin-top:30px;
        background:#1e293b;
        padding:25px;
        border-radius:12px;
    }

    .summary h2{
        margin-bottom:15px;
    }

    .summary p{
        font-size:18px;
        margin-top:10px;
    }

    /* Responsive */
    @media(max-width:768px){
        .info-box{
            flex-direction:column;
        }

        .btn-box{
            flex-direction:column;
        }

        button{
            width:100%;
        }

        table{
            font-size:14px;
        }
    }
    </style>
</head>

<body>

<div class="container">

    <h1>出勤・退勤 管理 System</h1>

    <div class="info-box">
        <input type="text" id="company" placeholder="Company Name">
        <input type="text" id="code" placeholder="Company Code">
        <input type="text" id="employee" placeholder="Your Name">
    </div>

    <div class="btn-box">
        <button class="start-btn" onclick="startWork()">出勤</button>
        <button class="end-btn" onclick="endWork()">退勤</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Company</th>
                <th>Code</th>
                <th>Name</th>
                <th>出勤時間</th>
                <th>退勤時間</th>
                <th>Work Time</th>
            </tr>
        </thead>

        <tbody id="tableBody"></tbody>
    </table>

    <div class="summary">
        <h2>Monthly Summary</h2>
        <p>Total Work Time : <strong id="totalWork">0</strong> hrs</p>
    </div>

</div>

<script>
let startTime = null;
let currentRow = null;
let totalWork = 0;

/* Load Saved Data */
window.onload = function(){
    const savedData =
    JSON.parse(localStorage.getItem("attendanceData"));

    if(savedData){
        document.getElementById("tableBody").innerHTML =
        savedData.table;

        totalWork = savedData.total;

        document.getElementById("totalWork").innerText =
        totalWork.toFixed(2);
    }
}

/* Save Data */
function saveData(){
    const data = {
        table: document.getElementById("tableBody").innerHTML,
        total: totalWork
    };

    localStorage.setItem(
        "attendanceData",
        JSON.stringify(data)
    );
}

/* 出勤 */
function startWork(){

    const company =
    document.getElementById("company").value;

    const code =
    document.getElementById("code").value;

    const employee =
    document.getElementById("employee").value;

    if(company === "" || code === "" || employee === ""){
        alert("Please fill all fields");
        return;
    }

    startTime = new Date();

    const date = startTime.toLocaleDateString();
    const start = startTime.toLocaleTimeString();

    const tbody = document.getElementById("tableBody");

    currentRow = tbody.insertRow();

    currentRow.innerHTML = `
        <td>${date}</td>
        <td>${company}</td>
        <td>${code}</td>
        <td>${employee}</td>
        <td>${start}</td>
        <td>-</td>
        <td>-</td>
    `;

    saveData();
}

/* 退勤 */
function endWork(){

    if(startTime === null){
        alert("First click 出勤");
        return;
    }

    const endTime = new Date();
    const end = endTime.toLocaleTimeString();

    const workHour =
    ((endTime - startTime) / (1000 * 60 * 60)).toFixed(2);

    totalWork += parseFloat(workHour);

    document.getElementById("totalWork").innerText =
    totalWork.toFixed(2);

    currentRow.cells[5].innerText = end;
    currentRow.cells[6].innerText = workHour + " hrs";

    startTime = null;

    saveData();
}
</script>

</body>
</html>
